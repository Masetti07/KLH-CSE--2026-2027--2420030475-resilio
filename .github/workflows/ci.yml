name: ResilioSpace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: src/backend
      - name: Run backend tests
        run: python -m pytest -q
        working-directory: src/backend

      - name: Run reproducible Day 6 experiments
        run: python scripts/run_day6_experiments.py --output-dir results/experiments
      - name: Preserve experiment evidence
        uses: actions/upload-artifact@v7
        with:
          name: day6-experiments
          path: results/experiments/

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: src/frontend
      - name: Run frontend tests
        run: npm test
        working-directory: src/frontend
      - name: Validate TypeScript
        run: npx tsc --noEmit
        working-directory: src/frontend
      - name: Build production frontend
        run: npm run build
        working-directory: src/frontend

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Generate complete Trivy repository report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: "0"
          ignore-unfixed: false
          timeout: 20m
          skip-dirs: .git,.venv,src/frontend/node_modules,src/backend/runtime,src/backend/tests/.runtime,results/security,src/frontend/dist
      - name: Preserve Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-repository-report
          path: trivy-fs.json
          retention-days: 30
          if-no-files-found: error
      - name: Gate on serious dependency or secret findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: false
          timeout: 10m
          skip-setup-trivy: true
          skip-dirs: .git,.venv,src/frontend/node_modules,src/backend/runtime,src/backend/tests/.runtime,results/security,src/frontend/dist

  container:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application containers
        run: docker compose build
